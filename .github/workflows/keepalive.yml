# Een gratis Supabase-project wordt gepauzeerd na 7 dagen zonder activiteit.
# Deze taak vraagt om de 3 dagen één kleine lijst op, zodat dat niet gebeurt.
# Nodig: repository secrets SUPABASE_URL en SUPABASE_ANON_KEY
# (GitHub > Settings > Secrets and variables > Actions).
name: Supabase wakker houden

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL en SUPABASE_ANON_KEY ontbreken; niets te doen."
            exit 0
          fi
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/seasons?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" > /dev/null
          echo "Supabase is wakker."
